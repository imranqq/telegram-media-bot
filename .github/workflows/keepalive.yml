name: Keep-alive

# Render free-план усыпляет сервис после 15 минут без HTTP-трафика.
# Пинг каждые 10 минут держит контейнер живым, чтобы бот отвечал в Telegram.
on:
  schedule:
    # Минимум, который даёт GitHub. На практике запуски всё равно опаздывают
    # на часы, поэтому основной механизм пробуждения — webhook в самом боте.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Repository variable RENDER_URL is not set (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi

          # Холодный старт free-плана занимает до минуты, поэтому три попытки
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL/health" || echo "000")
            echo "attempt $attempt → HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 20
          done

          echo "::error::Service did not answer with 200 after 3 attempts"
          exit 1
